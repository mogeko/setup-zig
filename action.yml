name: Setup Zig
description: Install the Zig toolchain on CI runners
author: Zheng Junyi <zhengjunyi@live.com>

inputs:
  version:
    description: |
      Version of Zig to install (e.g. "0.14.0" or "master").
      Defaults to the `minimum_zig_version` field in build.zig.zon, or "latest".
    required: false
  cache:
    description: |
      Caching behavior: "binary" (default) caches only the Zig toolchain,
      "all" additionally caches the Zig global cache, "false" disables caching.
    required: false
    default: binary

outputs:
  version:
    description: The resolved Zig version that was installed
  path:
    description: The directory containing the `zig` executable
  cache-hit:
    description: Whether the Zig toolchain was restored from cache

runs:
  using: node24
  main: dist/index.js

branding:
  icon: package
  color: orange
