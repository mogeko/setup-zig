name: Setup Zig
description: Install the Zig toolchain on CI runners
author: Zheng Junyi <zhengjunyi@live.com>

inputs:
  version:
    description: |
      Version of Zig to install. Accepts an exact version (e.g. "0.16.0"),
      a partial version (e.g. "0.16" resolves to the latest "0.16.x"),
      "master", or "latest".
      Defaults to the `minimum_zig_version` field in build.zig.zon, or "latest".
    required: false
  cache:
    description: |
      Caching behavior: "binary" (default) caches only the Zig toolchain,
      "all" additionally caches the Zig global and project-local compile caches,
      "false" disables caching.
    required: false
    default: binary
  cache-key:
    description: |
      Additional component for the compile cache keys. Use this to keep matrix
      jobs that build with different options (for example different targets or
      CPU models) in separate caches. The runner OS and architecture are always
      included automatically.
    required: false
  cache-size-limit:
    description: |
      Maximum size of each cached Zig compile cache directory, in MiB.
      Directories that exceed the limit are cleared before being saved so that
      stale artifacts do not exhaust the repository cache quota.
      Set to 0 to disable the limit.
    required: false
    default: "2048"

outputs:
  version:
    description: The resolved Zig version that was installed
  path:
    description: The directory containing the `zig` executable
  cache-hit:
    description: Whether the Zig toolchain was restored from cache

runs:
  using: node24
  main: dist/index.js
  post: dist/post.js

branding:
  icon: package
  color: orange
