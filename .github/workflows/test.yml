name: Test action

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        version: ["0.14.0", "master"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        id: zig
        uses: ./
        with:
          version: ${{ matrix.version }}

      - name: Verify zig
        shell: bash
        run: |
          zig version
          echo "version output: ${{ steps.zig.outputs.version }}"
          echo "install path:  ${{ steps.zig.outputs.path }}"
          echo "cache hit:     ${{ steps.zig.outputs.cache-hit }}"
