name: Test action

on:
  push:
    branches: [master, dev]
  pull_request:

jobs:
  unit-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx biome ci
      - run: bun run test

  integration-testing:
    strategy:
      fail-fast: false
      matrix:
        version: ["0", "0.15", "0.16.0", "latest", "master"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Zig
        id: zig
        uses: ./
        with:
          version: ${{ matrix.version }}
      - name: Verify zig
        run: |
          zig version
          echo "version output: ${{ steps.zig.outputs.version }}"
          echo "install path:  ${{ steps.zig.outputs.path }}"
          echo "cache hit:     ${{ steps.zig.outputs.cache-hit }}"

  examples:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: action
      - name: Move example project to workspace root
        shell: bash
        run: |
          mv action/examples/hello/build.zig .
          mv action/examples/hello/build.zig.zon .
          mv action/examples/hello/src .
      - name: Setup Zig
        uses: ./action
        with:
          cache: all
      - run: zig build
      - run: zig build run
